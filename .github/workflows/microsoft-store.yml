name: Microsoft Store

on:
  workflow_call:
    inputs:
      submit:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      submit:
        description: Submit an update for certification after the first Store publication
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Build Windows x64 MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: microsoft-store-x64

      - run: npm ci

      - name: Build CloudDash for the Store
        env:
          VITE_CLOUDDASH_MICROSOFT_STORE: 'true'
        run: npm run tauri-build -- --no-bundle --target x86_64-pc-windows-msvc --features microsoft-store --ci

      - name: Package MSIX
        run: ./scripts/package-microsoft-store.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: clouddash-microsoft-store-x64
          path: release-dist/microsoft-store/clouddash-windows-x64.msix
          if-no-files-found: error

  submit:
    name: Submit update for Microsoft Store certification
    if: inputs.submit
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: microsoft-store
    concurrency:
      group: microsoft-store-submission
      cancel-in-progress: false
    steps:
      - name: Require the release branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo '::error::Microsoft Store updates must be submitted from main.'
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: clouddash-microsoft-store-x64
          path: store-package

      - name: Archive MSIX for Partner Center
        shell: bash
        run: |
          set -euo pipefail
          version="$(unzip -p store-package/clouddash-windows-x64.msix AppxManifest.xml | python3 -c 'import sys, xml.etree.ElementTree as ET; print(ET.parse(sys.stdin).find("{*}Identity").attrib["Version"])')"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.0$ ]]; then
            echo '::error::Invalid Microsoft Store package version.'
            exit 1
          fi
          name="clouddash-windows-${version}-x64.msix"
          mv store-package/clouddash-windows-x64.msix "store-package/$name"
          (cd store-package && zip -0 package.zip "$name")
          echo "MSSTORE_PACKAGE_NAME=$name" >> "$GITHUB_ENV"
          echo "MSSTORE_PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Submit for automatic publishing after certification
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_ZIP_PATH: store-package/package.zip
        run: node scripts/submit-microsoft-store.mjs
