name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag. Defaults to v{src-tauri version}.
        required: false
        default: ""
      macos_backfill:
        description: Add notarized Mac installers to an existing stable release
        type: boolean
        default: false
      draft:
        description: Create the release as a draft
        required: true
        type: boolean
        default: false
      prerelease:
        description: Mark the release as a prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      draft: ${{ steps.release.outputs.draft }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      source_ref: ${{ steps.release.outputs.source_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          MACOS_BACKFILL: ${{ inputs.macos_backfill }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          tag="${REQUESTED_TAG:-v$version}"
          source_ref="$GITHUB_SHA"

          if [[ "$MACOS_BACKFILL" == true ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main || -z "$REQUESTED_TAG" ]]; then
              echo "::error::Backfill an explicit release tag from main."
              exit 1
            fi
            if [[ "$RELEASE_DRAFT" == true || "$RELEASE_PRERELEASE" == true ]]; then
              echo "::error::Mac backfills require an existing stable release."
              exit 1
            fi
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Provide a release tag such as v1.1.8."
              exit 1
            fi
            state="$(gh release view "$tag" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')"
            if [[ "$state" != false ]]; then
              echo "::error::The release must already be public and stable."
              exit 1
            fi
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            source_ref="$(git rev-parse "refs/tags/$tag^{commit}")"
            version="$(git show "$source_ref:src-tauri/tauri.conf.json" | jq -er .version)"
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::The release tag does not match the tagged app version."
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "draft=$RELEASE_DRAFT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$RELEASE_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: Fail if release already exists
        if: ${{ !inputs.macos_backfill }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          check_release_tag() {
            local candidate="$1"

            set +e
            output="$(gh release view "$candidate" --repo "$GITHUB_REPOSITORY" 2>&1)"
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "::error::GitHub Release '$candidate' already exists. Bump src-tauri/tauri.conf.json version or choose a new release_tag before deploying."
              exit 1
            fi

            if ! grep -qiE "not found|HTTP 404|release not found" <<< "$output"; then
              echo "::error::Could not verify whether GitHub Release '$candidate' already exists."
              echo "$output"
              exit 1
            fi
          }

          check_release_tag "$RELEASE_TAG"

          canonical_tag="v${RELEASE_VERSION}"
          if [ "$canonical_tag" != "$RELEASE_TAG" ]; then
            check_release_tag "$canonical_tag"
          fi

          existing_version_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json name,tagName --jq "[.[] | select(.name == \"CloudDash ${RELEASE_VERSION}\") | .tagName][0] // \"\"")"
          if [ -n "$existing_version_tag" ]; then
            echo "::error::Release version '${RELEASE_VERSION}' already exists as GitHub Release '$existing_version_tag'. Bump src-tauri/tauri.conf.json before deploying."
            exit 1
          fi

  verify:
    name: Verify (check, test)
    needs: prepare
    if: ${{ !inputs.macos_backfill }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: verify
          cache-on-failure: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  macos:
    name: Sign macOS ${{ matrix.label }}
    needs: [prepare, verify]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (inputs.macos_backfill || needs.verify.result == 'success') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    environment: macos-website
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
            macho_arch: arm64
          - label: Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
            macho_arch: x86_64
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      MAC_TARGET: ${{ matrix.target }}
      MAC_ARCH: ${{ matrix.arch }}
      MACHO_ARCH: ${{ matrix.macho_arch }}
      MACOS_BACKFILL: ${{ inputs.macos_backfill }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-macos-${{ matrix.arch }}
          cache-on-failure: true

      - run: npm ci

      - name: Build and verify the Developer ID signature
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::The release signing configuration is missing $name."
              exit 1
            fi
          done

          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/clouddash-signing.XXXXXX")"
          keychain="$signing_dir/website.keychain-db"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -rf "$signing_dir"' EXIT
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$signing_dir/developer-id.p12"
          security import "$signing_dir/developer-id.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"

          identities="$(security find-identity -v -p codesigning "$keychain")"
          signing_identity="$(awk -F'"' '/Developer ID Application: .*\(AF2ZRN4Q56\)/ {print $2; exit}' <<< "$identities")"
          if [[ -z "$signing_identity" ]]; then
            echo "::error::No trusted ChatbotsPlace Developer ID Application identity was imported."
            exit 1
          fi

          export APPLE_SIGNING_IDENTITY="$signing_identity"
          export APPLE_API_KEY_PATH="$signing_dir/AuthKey_$APPLE_API_KEY.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          unset APPLE_API_PRIVATE_KEY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
          if [[ "$MACOS_BACKFILL" == true ]]; then
            # Backfills distribute only the DMG, which Apple scans with its enclosed app.
            env -u APPLE_API_KEY_PATH -u APPLE_API_KEY -u APPLE_API_ISSUER \
              npm run tauri-build -- --ci --target "$MAC_TARGET"
          else
            npm run tauri-build -- --ci --target "$MAC_TARGET"
          fi

          shopt -s nullglob
          bundle="src-tauri/target/$MAC_TARGET/release/bundle"
          apps=("$bundle"/macos/*.app)
          images=("$bundle"/dmg/*.dmg)
          if [[ "${#apps[@]}" != 1 || "${#images[@]}" != 1 ]]; then
            echo "::error::Expected one app and one DMG for $MAC_TARGET."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          if [[ "$MACOS_BACKFILL" != true ]]; then
            xcrun stapler validate "${apps[0]}"
          fi
          executable="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "${apps[0]}/Contents/Info.plist")"
          lipo "${apps[0]}/Contents/MacOS/$executable" -verify_arch "$MACHO_ARCH"

          dmg="${images[0]}"
          codesign --verify --strict --verbose=2 "$dmg"
          npm run release:stage -- macos "$MAC_TARGET"

      - uses: actions/upload-artifact@v4
        with:
          name: signed-macos-${{ matrix.arch }}
          path: release-dist
          if-no-files-found: error

  notarize-macos:
    name: Notarize macOS ${{ matrix.arch }} DMG
    needs: macos
    runs-on: macos-15
    timeout-minutes: 80
    environment: macos-website
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    env:
      MAC_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-macos-${{ matrix.arch }}
          path: release-dist

      - name: Notarize and verify the signed disk image
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          notary_dir="$(mktemp -d "$RUNNER_TEMP/clouddash-notary.XXXXXX")"
          trap 'rm -rf "$notary_dir"' EXIT
          private_key="$notary_dir/AuthKey_$APPLE_API_KEY.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$private_key"
          unset APPLE_API_PRIVATE_KEY
          auth=(--key "$private_key" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          response="$notary_dir/response.json"
          dmg="release-dist/clouddash-darwin-$MAC_ARCH.dmg"

          codesign --verify --strict --verbose=2 "$dmg"
          xcrun notarytool submit "$dmg" "${auth[@]}" --output-format json > "$response"
          submission="$(jq -er '.id' "$response")"
          echo "Apple notarization submission: $submission"

          deadline=$((SECONDS + 3600))
          status="In Progress"
          while (( SECONDS < deadline )); do
            if xcrun notarytool info "$submission" "${auth[@]}" --output-format json > "$response"; then
              status="$(jq -er '.status' "$response")"
              if [[ "$status" != "In Progress" ]]; then
                break
              fi
            else
              echo "::warning::Could not check notarization status. Retrying the same submission."
            fi
            sleep 30
          done

          if [[ "$status" == "In Progress" ]]; then
            echo "::error::Apple is still processing submission $submission."
            exit 1
          fi
          if [[ "$status" != "Accepted" ]]; then
            xcrun notarytool log "$submission" "${auth[@]}"
            exit 1
          fi

          for delay in 5 15 30; do
            if xcrun stapler staple "$dmg"; then
              break
            fi
            sleep "$delay"
          done
          xcrun stapler validate "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          cp "$dmg" "release-dist/clouddash-darwin-$MAC_ARCH-notarized.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-dist
          if-no-files-found: error

  publish-macos-downloads:
    name: Publish notarized Mac installers
    needs: [prepare, notarize-macos]
    if: inputs.macos_backfill
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-macos-*
          path: release-assets
          merge-multiple: true

      - name: Add verified DMGs to the existing release
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for arch in aarch64 x86_64; do
            file="clouddash-darwin-$arch-notarized.dmg"
            test -s "release-assets/$file"
            if ! grep -Fxq "$file" <<< "$assets"; then
              gh release upload "$RELEASE_TAG" "release-assets/$file" --repo "$GITHUB_REPOSITORY"
            fi
          done

  android:
    name: Android APK and AAB
    needs: [prepare, verify]
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate updater signing secret
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required because src-tauri/tauri.conf.json enables bundle.createUpdaterArtifacts."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
          cache-on-failure: true

      - name: Configure Android signing
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/clouddash-upload.jks"
          echo "storeFile=$RUNNER_TEMP/clouddash-upload.jks" >> keystore.properties

      - name: Install dependencies
        run: npm ci

      - name: Build Android artifacts
        run: npm run tauri-android-build

      - name: Stage Android assets
        run: npm run release:stage -- android

      - name: Upload staged assets
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-dist
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs:
      - prepare
      - notarize-macos
      - android
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_DRAFT: ${{ needs.prepare.outputs.draft }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download staged assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          CloudDash ${RELEASE_VERSION}

          Official builds for macOS and Android. The Windows app is available through the Microsoft Store.
          The macOS installers are signed with Developer ID and notarized by Apple.
          EOF

      - name: Create release
        shell: bash
        run: |
          for candidate in "$RELEASE_TAG" "v${RELEASE_VERSION}"; do
            if gh release view "$candidate" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::GitHub Release '$candidate' already exists. Refusing to overwrite release assets."
              exit 1
            fi
          done

          args=(release create "$RELEASE_TAG" release-assets/* --title "CloudDash ${RELEASE_VERSION}" --notes-file release-notes.md --target "$GITHUB_SHA")
          if [ "$RELEASE_DRAFT" = "true" ]; then
            args+=(--draft)
          fi
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

  microsoft-store:
    name: Release to Microsoft Store
    needs: [prepare, publish]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.draft == 'false' && needs.prepare.outputs.prerelease == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/microsoft-store.yml
    with:
      submit: true
